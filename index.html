<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mintly</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%2310b981'/%3E%3Cpath d='M11 28V13l9 9 9-9v15' fill='none' stroke='white' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;background:#EAF5EE;color:#111827;min-height:100vh;
background-image:radial-gradient(600px 300px at 10% -5%,#cfeedb,transparent),radial-gradient(500px 300px at 100% 0,#dff3f0,transparent)}
.glass{background:rgba(255,255,255,.65);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);box-shadow:0 1px 0 rgba(17,24,39,.03)}
.lift{transition:transform .2s,box-shadow .2s}.lift:hover{transform:translateY(-3px);box-shadow:0 12px 28px -12px rgba(17,24,39,.22)}
.pill{background:#111827;color:#fff;border-radius:999px;transition:transform .15s,opacity .15s}.pill:active{transform:scale(.96)}
.ghost{border:1px solid rgba(17,24,39,.12);border-radius:999px;background:rgba(255,255,255,.6)}
.inp{width:100%;padding:.7rem .9rem;border-radius:14px;border:1px solid rgba(17,24,39,.12);background:#fff;font-size:.9rem;outline:none}
.inp:focus-within{border-color:#111827;box-shadow:0 0 0 3px rgba(17,24,39,.08)}
.bare{flex:1;min-width:0;background:none;border:0;outline:0;font:inherit}
button{cursor:pointer}
.b-soon{background:#fef3c7;color:#b45309}
.stg>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*50ms)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.seg{position:relative;display:flex;padding:4px;border-radius:999px;background:rgba(255,255,255,.7);border:1px solid rgba(255,255,255,.9)}
.seg>i{position:absolute;top:4px;bottom:4px;left:4px;border-radius:999px;background:#111827;transition:transform .4s cubic-bezier(.3,.9,.3,1)}
.seg button{position:relative;z-index:1;flex:1;padding:.55rem 0;font-size:.75rem;font-weight:700;border-radius:999px;transition:color .25s}
.seg button.on{color:#fff}
.bar{height:6px;background:rgba(17,24,39,.08);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:#10b981;border-radius:99px;transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(0)}}
.cal{display:none;margin-top:.5rem;padding:.75rem;background:#fff;border-radius:18px;border:1px solid rgba(17,24,39,.08)}
.cal.open{display:block;animation:rise .25s both}
.day{aspect-ratio:1;border-radius:12px;font-size:.8rem;font-weight:600;transition:background .15s}
.day:hover{background:#e3f3e9}.day.sel{background:#111827;color:#fff}.day.tod{box-shadow:inset 0 0 0 1px #111827}
.dlg{max-width:360px;border-radius:28px;animation:pop .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{transform:scale(.92);opacity:0}}
.ov.c{align-items:center;padding:1rem}
.inp{transition:border-color .25s,box-shadow .25s}
.nav{display:flex;align-items:center;gap:.75rem;width:100%;padding:.75rem .9rem;border-radius:14px;font-weight:700;font-size:.9rem;transition:background .2s,color .2s}
.nav:hover{background:rgba(255,255,255,.6)}.nav.on{background:#111827;color:#fff}
.cf{position:fixed;top:55%;width:8px;height:12px;border-radius:2px;z-index:80;animation:cf 1.3s cubic-bezier(.2,.8,.3,1) forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
@media(min-width:1024px){body{background-attachment:fixed}.sheet{max-width:520px}}
.badge{display:inline-flex;align-items:center;gap:.4rem;font-size:.7rem;font-weight:700;padding:.25rem .6rem;border-radius:999px}
.badge i{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
.b-active{background:#d5f0df;color:#0f7a3d}.b-overdue{background:#fee2e2;color:#b91c1c}.b-done{background:#e5e7eb;color:#374151}.b-done i{animation:none}
@keyframes pulse{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 6px transparent;opacity:.6}100%{box-shadow:0 0 0 0 transparent;opacity:1}}
.view{animation:fade .3s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.ov{position:fixed;inset:0;background:rgba(17,24,39,.4);display:flex;align-items:flex-end;justify-content:center;animation:ovin .2s;z-index:50}
.sheet{background:#F6FBF8;width:100%;max-width:480px;max-height:92vh;overflow:auto;border-radius:28px 28px 0 0;padding:1.25rem;animation:up .3s cubic-bezier(.2,.9,.3,1)}
@keyframes up{from{transform:translateY(60px);opacity:0}to{transform:none;opacity:1}}@keyframes ovin{from{opacity:0}to{opacity:1}}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:28px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
button:focus-visible,a:focus-visible{outline:2px solid #111827;outline-offset:2px}
</style>
</head>
<body>
<div id="app" class="max-w-md lg:max-w-6xl mx-auto px-4 lg:px-8 pt-6 lg:pt-8 pb-28 lg:pb-12"></div>
<div id="modal"></div>
<div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 pill px-4 py-2 text-sm font-semibold opacity-0 pointer-events-none transition-opacity z-[60]"></div>

<script>
const KEY='mintly.v1',DAY=864e5,$=s=>document.querySelector(s);
const def=()=>({wallet:0,pay:'',loans:[]});
let S;try{S=JSON.parse(localStorage.getItem(KEY))||def()}catch{S=def()}
let tab='active';
const save=()=>{S.ts=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch{}push()};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const pd=s=>new Date(s+'T00:00:00');
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
const fdate=s=>pd(s).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
const rnd=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>(b%36).toString(36)).join('');
const uid=()=>rnd(16);
const P={link:'M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71',
edit:'M17 3a2.85 2.85 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z',plus:'M5 12h14M12 5v14',trash:'M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2',
check:'M20 6 9 17l-5-5',cash:'M2 6h20v12H2zM12 9a3 3 0 1 0 0 6 3 3 0 0 0 0-6',cal:'M8 2v4M16 2v4M3 10h18M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z',search:'M11 19a8 8 0 1 0 0-16 8 8 0 0 0 0 16zM21 21l-4.3-4.3',bell:'M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.94 1.94 0 0 0 3.4 0',dl:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3',up:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M17 8l-5-5-5 5M12 3v12',down:'M17 7 7 17M17 17H7V7',user:'M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z',key:'M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3M7.5 10.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11z'};
const ic=(n,s=16)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="${P[n]}"/></svg>`;

/* Calculation: simple interest; base accrues to due date and continues after it.
   Each overdue week adds `pen` extra % (weekly) on top: day d of overdue uses pen * ceil(d/7). */
function calc(l,at){
  const done=l.status==='done',end=at||(done&&l.doneAt?pd(l.doneAt):today()),s=pd(l.start),due=pd(l.due);
  const daily=l.t==='weekly'?l.r/700:l.r/3000;
  const days=Math.max(0,Math.round((Math.min(end,due)-s)/DAY));
  const over=Math.max(0,Math.round((end-due)/DAY));
  const base=l.p*daily*days;
  let extra=0;for(let d=1;d<=Math.min(over,3650);d++)extra+=l.p*(daily+(l.x/700)*Math.ceil(d/7));
  const interest=base+extra,paid=l.paid||0;
  return{days,over,base,extra,interest,paid,owed:Math.max(0,l.p+interest-paid),
    st:done?'done':over>0?'overdue':'active',daysLeft:Math.round((due-end)/DAY)};
}
const badge=c=>c.st==='done'?'<span class="badge b-done"><i></i>Completed</span>':c.st==='overdue'?`<span class="badge b-overdue"><i></i>${c.over} day${c.over>1?'s':''} overdue</span>`:c.daysLeft<=3?`<span class="badge b-soon"><i></i>Due ${c.daysLeft<=0?'today':'in '+c.daysLeft+'d'}</span>`:'<span class="badge b-active"><i></i>Active</span>';
const init=n=>esc(n.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()||'?');
const avatar=n=>`<div class="w-11 h-11 rounded-full bg-[#111827] text-white grid place-items-center font-bold text-sm shrink-0">${init(n)}</div>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)};

/* ---------- Server: accounts, sync, loan codes ---------- */
let TOK=localStorage.getItem('mintly.tok')||'',ME=null;try{ME=JSON.parse(localStorage.getItem('mintly.me'))}catch{}
async function api(p,method='GET',body){
  const r=await fetch('/api/'+p,{method,headers:{'content-type':'application/json',...(TOK?{authorization:'Bearer '+TOK}:{})},body:body?JSON.stringify(body):undefined});
  let j={};try{j=await r.json()}catch{}
  if(!r.ok)throw new Error(j.error||(r.status===404?'Server function not found (is edge-functions deployed?)':'Server '+r.status));return j;
}
let pt;function push(){if(!TOK)return;clearTimeout(pt);pt=setTimeout(()=>api('data','PUT',{d:S}).catch(()=>{}),800)}
const snap=l=>({by:ME?ME.name:'Your lender',n:l.n,p:l.p,s:l.start,d:l.due,t:l.t,r:l.r,x:l.x,paid:l.paid||0,st:l.status,dn:l.doneAt||'',i:S.pay});
async function sync(l){if(!l||!l.code||dr(l)==='in')return;try{await api('code/'+l.code,'PUT',{tok:l.tok,snap:snap(l)})}catch{}}
const syncAll=()=>S.loans.forEach(sync);
const nudgeText=(l,c)=>{const k=calc(l);return `Hi ${l.n.split(' ')[0]}, a quick reminder that ${money(k.owed)} ${k.st==='overdue'?'is now overdue':'is due on '+fdate(l.due)}. Open Mintly, go to Borrowing, and enter code ${c} for the breakdown and how to pay.`};
async function getCode(id,nudge){
  const l=S.loans.find(x=>x.id===id);
  try{if(!l.code){const r=await api('code','POST',{snap:snap(l)});l.code=r.code;l.tok=r.tok;save()}else await sync(l)}
  catch(e){return dlg({title:'Could not create a code',msg:esc(e.message)+'. Open Settings to check the server.',ok:'OK',hideCancel:1})}
  const c=l.code.slice(0,4)+'-'+l.code.slice(4);
  try{await navigator.clipboard.writeText(nudge?nudgeText(l,c):c)}catch{}
  refresh();
  dlg({title:nudge?'Reminder copied':'Loan code',msg:nudge?'Paste it into a message.':`<div class="text-3xl font-extrabold tracking-[.2em] text-center my-3 text-gray-900">${c}</div>Copied. Ask ${esc(l.n)} to open Mintly, tap Borrowing, and enter this code.`,ok:'Done',hideCancel:1});
}
const mirror=(l,s)=>Object.assign(l,{n:s.by,p:s.p,start:s.s,due:s.d,t:s.t,r:s.r,x:s.x,paid:s.paid,status:s.st,doneAt:s.dn||l.doneAt||'',pay:s.i});
async function joinCode(){
  const v=await dlg({title:'Enter loan code',msg:'Use the code your lender received when they created the loan.',text:1,ok:'Add loan'});if(!v)return;
  const code=v.replace(/[^A-Za-z0-9]/g,'').toUpperCase();
  if(S.loans.some(l=>l.code===code&&dr(l)==='in'))return toast('You already added this loan');
  try{const s=await api('code/'+code);S.loans.unshift(mirror({id:uid(),dir:'in',code,note:'Linked to lender'},s));save();tab='borrow';render();toast('Loan added')}catch(e){toast(e.message)}
}
async function pull(){let ch=0;for(const l of S.loans)if(l.code&&dr(l)==='in')try{mirror(l,await api('code/'+l.code));ch=1}catch{}
  if(ch){save();if($('#list')&&!$('#modal').innerHTML)refresh()}}
const howPay=id=>{const l=S.loans.find(x=>x.id===id);dlg({title:'How to pay',msg:esc(l.pay||'Your lender has not added payment instructions yet.').replace(/\n/g,'<br>'),ok:'Close',hideCancel:1})};
function authSheet(reg){sheet(hd(reg?'Create account':'Sign in')+`<form onsubmit="doAuth(event,${reg})">${reg?txt('name','','Name','Your name',1):''}${txt('email','','Email','you@example.com',1)}<div class="mb-3">${lb('Password')}<input class="inp" type="password" name="pw" minlength="8" required placeholder="8+ characters"></div><button class="pill w-full py-3.5 font-bold text-sm">${reg?'Create account':'Sign in'}</button></form><button onclick="authSheet(${!reg})" class="w-full text-xs font-semibold text-gray-500 mt-3">${reg?'Have an account? Sign in':'New here? Create an account'}</button>`)}
async function doAuth(e,reg){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));
  try{const r=await api(reg?'register':'login','POST',f);TOK=r.tok;ME={name:r.name,email:r.email};localStorage.setItem('mintly.tok',TOK);localStorage.setItem('mintly.me',JSON.stringify(ME));
    if(r.d&&r.d.loans&&r.d.loans.length&&(!S.loans.length||await dlg({title:'Use your saved data?',msg:'This account already has loans. Replace what is on this device with them?',ok:'Use saved data'})))S={...def(),...r.d};
    save();closeM();render();toast('Welcome, '+r.name)}catch(x){toast(x.message)}}
function signOut(){TOK='';ME=null;localStorage.removeItem('mintly.tok');localStorage.removeItem('mintly.me');closeM();render();toast('Signed out')}
async function boot(){render();
  if(TOK)try{const r=await api('data');if(r.d&&r.d.loans&&(r.ts||0)>(S.ts||0)){S={...def(),...r.d};localStorage.setItem(KEY,JSON.stringify(S));render()}}catch(e){if(/sign in/i.test(e.message)){TOK='';ME=null;localStorage.removeItem('mintly.tok');render()}}
  pull();setInterval(pull,60000)}

/* ---------- Lender view ---------- */
let q='';const dr=l=>l.dir||'out',TABS=['active','borrow','history'];
function countTo(el,to){const from=+el.dataset.v||0,t0=performance.now();el.dataset.v=to;
  const f=t=>{const k=Math.min(1,(t-t0)/600),e=1-Math.pow(1-k,3);el.textContent=money(from+(to-from)*e);if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)}
const LEGAL={terms:['Terms of Service',['Mintly is a record-keeping and calculation tool. It does not lend, hold, or move money.','It is not financial, legal, or tax advice. Interest figures are estimates based on the terms you enter, so check them against your own agreement.','You are responsible for making sure your loans, interest rates, and late charges are lawful where you and the other party live.','Without an account, your data lives only in your browser and is lost if you clear site data, unless you exported a backup. Keep your password safe; there is no password reset yet.','Share a loan code only with the person named on that loan. Anyone holding the code can view that loan.','The service is provided "as is", without warranties. To the extent the law allows, Mintly is not liable for unpaid loans, disputes, or lost data.','We may change or discontinue the service or these terms at any time.']],
privacy:['Privacy Policy',['Accounts are optional. Without one, your loans, notes, and settings stay in your browser and are not sent to us.','If you create an account, we store your name, your email, a salted hash of your password, and your loan data with our hosting provider (Tencent EdgeOne) so it can sync across your devices.','When you create a loan code, that loan\'s amounts, dates, rates, payments, your name, and your payment instructions are stored so the borrower can see them. Private notes are never included. Deleting a loan removes its code.','Anyone who has a loan code can view that loan.','We do not use analytics, ads, or tracking cookies. Our hosting provider may keep standard server logs, such as IP addresses.','Backup files you export stay on your device.']]};
const foot=()=>`<footer class="mt-10 text-center text-xs text-gray-500"><div class="flex justify-center gap-5 font-semibold"><button onclick="legal('terms')" class="hover:text-gray-900 transition">Terms of Service</button><button onclick="legal('privacy')" class="hover:text-gray-900 transition">Privacy Policy</button></div><div class="mt-2">&copy; ${new Date().getFullYear()} Mintly. All rights reserved.</div></footer>`;
const hd=t=>`<div class="flex justify-between items-center mb-4"><h2 class="text-lg font-extrabold">${t}</h2><button onclick="closeM()" class="ghost px-3 py-1.5 text-xs font-semibold">Close</button></div>`;
const legal=k=>sheet(hd(LEGAL[k][0])+`<div class="space-y-3 text-sm text-gray-700">${LEGAL[k][1].map(x=>`<p>${x}</p>`).join('')}</div>`);

function card(l,c,i){
  const o=dr(l)==='out',act=l.status==='active',tot=l.p+c.interest,pct=Math.min(100,Math.round(c.paid/(tot||1)*100));
  const B=(cls,fn,ico,t)=>`<button onclick="${fn}" class="${cls} text-xs font-semibold px-3 py-2 flex items-center gap-1.5">${ic(ico,14)}${t}</button>`;
  const lk=!o&&l.code,own=(o?B('pill',`getCode('${l.id}')`,'key',l.code?'Show code':'Get code')+(c.st==='overdue'?B('ghost',`getCode('${l.id}',1)`,'bell','Nudge'):''):'')+B('ghost',`payment('${l.id}')`,'cash',o?'Payment':'I paid')+B('ghost',`settle('${l.id}')`,'check',o?'Settle':'Repaid')+`<button aria-label="Edit" onclick="openForm('${l.id}')" class="ghost p-2">${ic('edit',14)}</button>`,
  acts=act?(lk?B('ghost',`howPay('${l.id}')`,'cash','How to pay')+`<span class="text-[11px] text-emerald-700 font-semibold flex items-center gap-1">${ic('link',12)}Synced with lender</span>`:own):'';
  const st=(a,b)=>`<div><div class="text-[11px] text-gray-500">${a}</div><div class="font-bold text-sm">${b}</div></div>`;
  return `<div class="glass lift rounded-3xl p-4" style="--i:${i}">
  <div class="flex items-center gap-3">${avatar(l.n)}<div class="min-w-0 flex-1"><div class="font-bold truncate">${esc(l.n)}</div><div class="text-xs text-gray-500 truncate">${esc(l.note||'No note')}</div></div>${badge(c)}</div>
  <div class="grid grid-cols-3 gap-2 mt-4 text-center">${st('Principal',money(l.p))}${st('Interest',money(c.interest))}${st(act?(o?'Owed to you':'You owe'):(o?'Received':'Paid'),money(act?c.owed:c.paid))}</div>
  ${act?`<div class="mt-3"><div class="flex justify-between text-[11px] text-gray-500 mb-1"><span>${pct}% repaid</span><span>${money(c.paid)} of ${money(tot)}</span></div><div class="bar"><i style="width:${pct}%"></i></div></div>`:''}
  <div class="text-xs text-gray-500 mt-3">${act?'':(o?'Lent':'Borrowed')+' · '}${l.r}% ${l.t} · ${act?'Due '+fdate(l.due)+(c.st==='active'?' ('+c.daysLeft+' days left)':''):'Settled '+fdate(l.doneAt)}${l.x?' · +'+l.x+'%/wk overdue':''}</div>
  <div class="flex flex-wrap gap-2 mt-3 items-center">${acts}<button aria-label="Delete" onclick="del('${l.id}')" class="ml-auto p-2 text-gray-400 hover:text-red-600 transition">${ic('trash',16)}</button></div></div>`;
}
function refresh(){
  const A=S.loans.map(l=>({l,c:calc(l)})),on=A.filter(x=>x.l.status==='active'),out=on.filter(x=>dr(x.l)==='out'),inn=on.filter(x=>dr(x.l)==='in'),hist=A.filter(x=>x.l.status==='done'),
  sm=(a,f)=>a.reduce((s,x)=>s+f(x),0),oy=sm(out,x=>x.c.owed),yo=sm(inn,x=>x.c.owed),h=d=>hist.filter(x=>dr(x.l)===d);
  countTo($('#net'),oy-yo);$('#oy').textContent=money(oy);$('#yo').textContent=money(yo);
  const M=tab==='active'?[['Lent out',money(sm(out,x=>x.l.p))],['Interest accrued',money(sm(out,x=>x.c.interest))],['Active loans',out.length]]
   :tab==='borrow'?[['Borrowed',money(sm(inn,x=>x.l.p))],['Interest accrued',money(sm(inn,x=>x.c.interest))],['Active',inn.length]]
   :[['Settled',hist.length],['Interest earned',money(sm(h('out'),x=>x.c.interest))],['Interest paid',money(sm(h('in'),x=>x.c.interest))]];
  $('#mets').innerHTML=M.map(m=>`<div class="glass rounded-2xl p-3"><div class="text-[11px] text-gray-500">${m[0]}</div><div class="font-extrabold text-sm mt-1 break-words">${m[1]}</div></div>`).join('');
  const L=(tab==='active'?out:tab==='borrow'?inn:hist).filter(x=>x.l.n.toLowerCase().includes(q)).sort((a,b)=>tab==='history'?(b.l.doneAt>a.l.doneAt?1:-1):(a.l.due>b.l.due?1:-1));
  $('#list').innerHTML=L.length?L.map((x,i)=>card(x.l,x.c,i)).join(''):`<div class="text-center text-sm text-gray-500 py-12 lg:col-span-2">${q?'No matches.':tab==='active'?'Nobody owes you yet. Tap the button below to add a loan.':tab==='borrow'?'Add money you owe, or enter a code from your lender.':'Settled loans will appear here.'}</div>`;
  $('#join').style.display=tab==='borrow'?'':'none';
  const up=[...on].sort((a,b)=>a.l.due>b.l.due?1:-1).slice(0,4);
  $('#soon').innerHTML=up.length?up.map(x=>`<div class="flex items-center gap-3 py-2">${avatar(x.l.n)}<div class="min-w-0 flex-1"><div class="text-sm font-bold truncate">${esc(x.l.n)}</div><div class="text-[11px] text-gray-500">${dr(x.l)==='out'?'Owes you':'You owe'} &middot; due ${fdate(x.l.due)}</div></div><div class="text-sm font-bold ${dr(x.l)==='out'?'text-emerald-700':'text-rose-600'}">${money(x.c.owed)}</div></div>`).join(''):'<div class="text-sm text-gray-500 py-8 text-center">Nothing due yet.</div>';
  const f=$('#fab');f.style.display=tab==='history'?'none':'';f.querySelector('span').textContent=tab==='active'?'Lend money':'Add borrowing';
}
function setTab(i){tab=TABS[i];document.querySelectorAll('.nav').forEach((b,j)=>b.classList.toggle('on',j===i));const s=$('#seg');s.querySelector('i').style.transform=`translateX(${i*100}%)`;s.querySelectorAll('button').forEach((b,j)=>b.classList.toggle('on',j===i));refresh()}
const logo=(s=36)=>`<div class="flex items-center gap-2.5"><svg width="${s}" height="${s}" viewBox="0 0 40 40"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#0f766e"/></linearGradient></defs><rect width="40" height="40" rx="12" fill="url(#lg)"/><path d="M11 28V13l9 9 9-9v15" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="20" cy="10.5" r="2.2" fill="#fff"/></svg><span class="text-xl font-extrabold tracking-tight">Mintly</span></div>`;
const acct=()=>`<button onclick="settings()" class="glass lift rounded-2xl p-3 w-full flex items-center gap-3 text-left">${ME?avatar(ME.name):`<div class="w-11 h-11 rounded-full bg-black/5 grid place-items-center text-gray-500">${ic('user',18)}</div>`}<div class="min-w-0"><div class="text-sm font-bold truncate">${ME?esc(ME.name):'Sign in'}</div><div class="text-[11px] ${ME?'text-emerald-700 font-semibold':'text-gray-500'}">${ME?'Synced':'Sync across devices'}</div></div></button>`;
function render(){
  const n=TABS.indexOf(tab);
  $('#app').innerHTML=`<div class="lg:flex lg:gap-10">
  <aside class="hidden lg:flex flex-col w-60 shrink-0 sticky top-6 self-start h-[calc(100vh-3rem)]">${logo()}
   <nav class="mt-10 space-y-1">${[['Lending','cash'],['Borrowing','down'],['History','check']].map((t,i)=>`<button onclick="setTab(${i})" class="nav ${i===n?'on':''}">${ic(t[1],18)}${t[0]}</button>`).join('')}</nav>
   <div class="text-[11px] text-gray-400 mt-4 px-1">Press <b>N</b> for a new entry, <b>/</b> to search</div>
   <div class="mt-auto space-y-4">${acct()}${foot()}</div></aside>
  <main class="flex-1 min-w-0 view">
   <div class="flex items-center justify-between mb-4 lg:hidden">${logo(32)}<button onclick="settings()" class="ghost text-xs font-semibold px-3 py-2">${ME?esc(ME.name.split(' ')[0]):'Sign in'}</button></div>
   <div class="lg:grid lg:grid-cols-5 lg:gap-4"><div class="lg:col-span-3">
    <div class="rounded-[28px] bg-[#111827] text-white p-6 lg:p-8 shadow-xl relative overflow-hidden h-full"><div class="absolute -right-10 -top-10 w-56 h-56 rounded-full bg-emerald-400/25 blur-3xl"></div>
     <div class="text-sm opacity-70">Net position</div><div id="net" class="text-4xl lg:text-5xl font-extrabold mt-1 tracking-tight">$0.00</div>
     <div class="grid grid-cols-2 gap-3 mt-5"><div class="bg-white/10 rounded-2xl p-3"><div class="text-[11px] opacity-70">Owed to you</div><div id="oy" class="font-bold"></div></div><div class="bg-white/10 rounded-2xl p-3"><div class="text-[11px] opacity-70">You owe</div><div id="yo" class="font-bold"></div></div></div></div></div>
    <div class="glass rounded-3xl p-4 mt-3 lg:mt-0 lg:col-span-2"><div class="text-sm font-extrabold">Coming up</div><div id="soon" class="divide-y divide-black/5"></div></div></div>
   <div id="mets" class="grid grid-cols-3 gap-3 mt-3"></div>
   <div class="lg:hidden"><div class="seg mt-5" id="seg"><i style="width:calc((100% - 8px)/3);transform:translateX(${n*100}%)"></i>${['Lending','Borrowing','History'].map((t,i)=>`<button onclick="setTab(${i})" class="${i===n?'on':''}">${t}</button>`).join('')}</div></div>
   <label class="inp flex items-center gap-2 mt-3 !rounded-full text-gray-400">${ic('search',16)}<input id="q" class="bare text-gray-900" placeholder="Search by name" value="${esc(q)}" oninput="q=this.value.toLowerCase();refresh()"></label>
   <button id="join" onclick="joinCode()" class="w-full mt-3 ghost py-3 text-sm font-semibold flex items-center justify-center gap-2">${ic('key',16)}Enter a loan code from your lender</button>
   <div id="list" class="stg grid gap-3 lg:grid-cols-2 mt-4"></div><div class="lg:hidden">${foot()}</div></main></div>
  <button id="fab" onclick="openForm(null,tab==='borrow'?'in':'out')" class="pill fixed bottom-6 left-1/2 -translate-x-1/2 lg:left-auto lg:right-10 lg:translate-x-0 px-6 py-3.5 flex items-center gap-2 font-bold text-sm shadow-2xl">${ic('plus',18)}<span></span></button>`;
  refresh();
}

/* ---------- Custom controls ---------- */
const sheet=h=>{$('#modal').innerHTML=`<div class="ov" onclick="if(event.target===this)closeM()"><div class="sheet">${h}</div></div>`};
const closeM=()=>$('#modal').innerHTML='';
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});
function dlg({title,msg='',input,text,val='',ok='OK',danger,hideCancel}){return new Promise(res=>{
  const el=document.createElement('div');el.className='ov c';el.style.zIndex=70;
  el.innerHTML=`<div class="sheet dlg"><h3 class="font-extrabold text-lg">${title}</h3><div class="text-sm text-gray-600 mt-1">${msg}</div>${input||text?`<div class="inp flex items-center gap-2 mt-3">${input?'<span class="text-gray-400">$</span>':''}<input class="bare ${text?'uppercase tracking-widest':''}" ${text?'placeholder="XXXX-XXXX"':'inputmode="decimal"'} value="${val}"></div>`:''}<div class="flex gap-2 mt-4"><button class="ghost flex-1 py-3 text-sm font-semibold" ${hideCancel?'style="display:none"':''}>Cancel</button><button class="pill flex-1 py-3 text-sm font-bold" ${danger?'style="background:#dc2626"':''}>${ok}</button></div></div>`;
  document.body.appendChild(el);const i=el.querySelector('input'),[c,o]=el.querySelectorAll('button'),done=v=>{el.remove();res(v)};
  c.onclick=()=>done(null);o.onclick=()=>done(i?i.value:true);el.onclick=e=>{if(e.target===el)done(null)};
  if(i){i.focus();i.oninput=()=>i.value=i.value.replace(text?/[^A-Za-z0-9-]/g:/[^0-9.]/g,'');i.onkeydown=e=>{if(e.key==='Enter')o.click()}}
})}
const lb=t=>`<div class="text-xs font-semibold text-gray-600 mb-1">${t}</div>`;
const txt=(nm,v,t,ph,req)=>`<div class="mb-3">${lb(t)}<input class="inp" name="${nm}" value="${esc(v)}" placeholder="${ph||''}" ${req?'required':''}></div>`;
const numF=(nm,v,t,pre,suf,step)=>`<div class="mb-3">${lb(t)}<div class="inp flex items-center gap-2">${pre?`<span class="text-gray-400">${pre}</span>`:''}<input name="${nm}" class="bare" inputmode="decimal" value="${v}" oninput="this.value=this.value.replace(/[^0-9.]/g,'');tint()">${suf?`<span class="text-gray-400">${suf}</span>`:''}${step?'<em class="tag not-italic text-[10px] font-bold"></em>':''}${step?`<button type="button" class="ghost w-7 h-7" onclick="stepN(this,-${step})">&minus;</button><button type="button" class="ghost w-7 h-7" onclick="stepN(this,${step})">+</button>`:''}</div></div>`;
const stepN=(b,d)=>{const i=b.parentNode.querySelector('input');i.value=Math.max(0,(+i.value||0)+d).toFixed(1).replace(/\.0$/,'');tint()};
const segF=(nm,v)=>`<div class="mb-3">${lb('Interest charged')}<div class="seg"><input type="hidden" name="${nm}" value="${v}"><i style="width:calc((100% - 8px)/2);transform:translateX(${v==='weekly'?0:100}%)"></i>${['weekly','monthly'].map(x=>`<button type="button" class="${x===v?'on':''}" data-v="${x}" onclick="segPick(this,'${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')}</div></div>`;
function segPick(b,v){const s=b.parentNode;s.querySelector('input').value=v;s.querySelector('i').style.transform=`translateX(${v==='weekly'?0:100}%)`;s.querySelectorAll('button').forEach(x=>x.classList.toggle('on',x===b));tint()}
const dp=(nm,v,t)=>`<div class="mb-3" data-dp>${lb(t)}<input type="hidden" name="${nm}" value="${v}"><button type="button" class="inp flex justify-between items-center text-left" onclick="dpToggle(this)"><span>${fdate(v)}</span>${ic('cal',16)}</button><div class="cal"></div></div>`;
function dpToggle(b){const w=b.closest('[data-dp]'),o=w.querySelector('.cal').classList.toggle('open');if(o){const d=pd(w.querySelector('input').value);dpDraw(w,d.getFullYear(),d.getMonth())}}
function dpDraw(w,y,m){const f=new Date(y,m,1);y=f.getFullYear();m=f.getMonth();
  const sel=w.querySelector('input').value,n=new Date(y,m+1,0).getDate(),t=iso(new Date());let g='<span></span>'.repeat(f.getDay());
  for(let d=1;d<=n;d++){const v=iso(new Date(y,m,d));g+=`<button type="button" class="day ${v===sel?'sel':''} ${v===t?'tod':''}" onclick="setDate('${w.querySelector('input').name}','${v}')">${d}</button>`}
  w.querySelector('.cal').innerHTML=`<div class="flex items-center justify-between mb-2"><button type="button" class="ghost w-8 h-8" onclick="dpDraw(this.closest('[data-dp]'),${y},${m-1})">&lsaquo;</button><b class="text-sm">${f.toLocaleDateString(undefined,{month:'long',year:'numeric'})}</b><button type="button" class="ghost w-8 h-8" onclick="dpDraw(this.closest('[data-dp]'),${y},${m+1})">&rsaquo;</button></div><div class="grid grid-cols-7 text-center text-[10px] text-gray-400 mb-1">${[...'SMTWTFS'].map(x=>`<span>${x}</span>`).join('')}</div><div class="grid grid-cols-7 gap-1">${g}</div>`}
function setDate(nm,v){const i=document.querySelector(`[name="${nm}"]`),w=i.closest('[data-dp]');i.value=v;w.querySelector('button span').textContent=fdate(v);w.querySelector('.cal').classList.remove('open');tint()}
const quickDue=d=>setDate('due',iso(new Date(pd(document.querySelector('[name="start"]').value).getTime()+d*DAY)));

/* ---------- Interest intensity, presets, projection ---------- */
const LV=[['Gentle','#10b981'],['Fair','#f59e0b'],['Steep','#f97316'],['Harsh','#ef4444']],lvl=(v,a)=>v<a[0]?0:v<a[1]?1:v<a[2]?2:3;
function tint(){const F=document.querySelector('form');if(!F||!F.querySelector('[name=r]'))return;
  const g=n=>F.querySelector(`[name=${n}]`),t=g('t').value,r=+g('r').value||0,x=+g('x').value||0,p=+g('p').value||0;
  [['r',lvl(t==='weekly'?r:r/4.33,[1,2.5,5])],['x',lvl(x,[1,2.5,5])]].forEach(([n,k])=>{const w=g(n).parentNode,c=LV[k][1],e=w.querySelector('.tag');
    w.style.borderColor=c;w.style.boxShadow=`0 0 0 3px ${c}33`;e.textContent=LV[k][0];e.style.color=c});
  const L={p,start:g('start').value,due:g('due').value,t,r,x,status:'active'},a=calc(L,pd(L.due)),b=calc(L,new Date(pd(L.due).getTime()+30*DAY));
  $('#proj').innerHTML=p?`Interest by due date <b>${money(a.interest)}</b><br>If 30 days late <b>${money(b.interest)}</b> (total owed ${money(p+b.interest)})`:'Enter an amount to preview interest.';
}
const PRE=[['Interest-free','monthly',0,0],['Friendly','monthly',2,.5],['Standard','monthly',5,1],['Firm','weekly',1.5,1],['Escalating','weekly',3,3]];
function preset(i){const [,t,r,x]=PRE[i],F=document.querySelector('form');segPick(F.querySelector(`.seg [data-v="${t}"]`),t);F.querySelector('[name=r]').value=r;F.querySelector('[name=x]').value=x;tint()}
function confetti(){for(let i=0;i<32;i++){const e=document.createElement('i');e.className='cf';e.style.cssText=`left:${50+(Math.random()-.5)*20}%;background:hsl(${140+Math.random()*60},70%,55%);--dx:${(Math.random()-.5)*500}px;--dy:${-150-Math.random()*300}px;--r:${Math.random()*720}deg`;document.body.appendChild(e);setTimeout(()=>e.remove(),1400)}}
document.addEventListener('keydown',e=>{if(/INPUT|TEXTAREA/.test(document.activeElement.tagName)||$('#modal').innerHTML||document.querySelector('.dlg'))return;
  if(e.key==='n'&&tab!=='history'){e.preventDefault();openForm(null,tab==='borrow'?'in':'out')}if(e.key==='/'){e.preventDefault();const s=$('#q');s&&s.focus()}});

/* ---------- Actions ---------- */
function openForm(id,dir){
  const e=S.loans.find(x=>x.id===id),d=e?dr(e):dir||'out',l=e||{n:'',note:'',p:'',start:iso(new Date()),due:iso(new Date(Date.now()+30*DAY)),t:'monthly',r:5,x:1};
  sheet(hd(e?'Edit':d==='out'?'Lend money':'Add borrowing')+`<form onsubmit="saveLoan(event,'${id||''}','${d}')" autocomplete="off">
  ${txt('n',l.n,d==='out'?'Borrower name':'Lender name','Who?',1)}${txt('note',l.note,'Private note','Phone, email, or reason')}${numF('p',l.p,'Amount','$')}
  ${dp('start',l.start,'Start date')}${dp('due',l.due,'Due date')}
  <div class="flex gap-2 -mt-1 mb-3">${[['1 week',7],['1 month',30],['3 months',90]].map(([t,n])=>`<button type="button" class="ghost text-[11px] font-semibold px-3 py-1.5" onclick="quickDue(${n})">+ ${t}</button>`).join('')}</div>
  ${lb('Presets')}<div class="flex flex-wrap gap-2 mb-3">${PRE.map((p,i)=>`<button type="button" class="ghost text-[11px] font-semibold px-3 py-1.5" onclick="preset(${i})">${p[0]}</button>`).join('')}</div>
  ${segF('t',l.t)}${numF('r',l.r,'Interest rate','','%',0.5)}${numF('x',l.x,'Extra rate added every week overdue','','%',0.5)}
  <div id="proj" class="text-xs text-gray-600 bg-white/70 rounded-2xl p-3 mb-3 leading-relaxed"></div>
  <button class="pill w-full py-3.5 font-bold text-sm mt-1">${e?'Save changes':'Save'}</button></form>`);tint();
}
function saveLoan(e,id,dir){
  e.preventDefault();const f=new FormData(e.target),g=k=>f.get(k);
  const d={n:g('n').trim(),note:g('note').trim(),p:parseFloat(g('p'))||0,start:g('start'),due:g('due'),t:g('t'),r:parseFloat(g('r'))||0,x:parseFloat(g('x'))||0};
  if(!d.n)return toast('Enter a name');if(d.p<=0)return toast('Enter an amount above 0');if(d.due<d.start)return toast('Due date must be after start date');
  if(id){const l=S.loans.find(x=>x.id===id);Object.assign(l,d);sync(l)}else{S.loans.unshift({...d,id:uid(),dir,status:'active',paid:0});tab=dir==='in'?'borrow':'active'}
  save();closeM();render();toast(id?'Changes saved':'Saved');
}
async function payment(id){
  const l=S.loans.find(x=>x.id===id),o=dr(l)==='out',c=calc(l);
  const v=await dlg({title:o?'Record payment':'Record your payment',msg:`${esc(l.n)} &middot; ${money(c.owed)} owed now`,input:1,ok:'Save'});if(v===null)return;
  const a=parseFloat(v);if(!(a>0))return toast('Enter an amount above 0');
  l.paid=(l.paid||0)+a;save();sync(l);refresh();toast(calc(l).owed<=0.005?'Fully paid. Tap '+(o?'Settle':'Repaid')+' to file it':'Payment recorded');
}
async function settle(id){
  const l=S.loans.find(x=>x.id===id),c=calc({...l,status:'done',doneAt:iso(new Date())});
  if(!await dlg({title:'Mark as settled?',msg:c.owed>0.005?`${money(c.owed)} still owed will be counted as paid.`:'Nothing further is owed.',ok:'Settle'}))return;
  l.status='done';l.doneAt=iso(new Date());l.paid=(l.paid||0)+c.owed;save();sync(l);tab='history';render();toast('Moved to history');confetti();
}
async function del(id){
  if(!await dlg({title:'Delete this record?',msg:'This cannot be undone.',ok:'Delete',danger:1}))return;
  const d=S.loans.find(x=>x.id===id);if(d.code&&d.tok&&dr(d)==='out')api('code/'+d.code,'DELETE',{tok:d.tok}).catch(()=>{});
  S.loans=S.loans.filter(l=>l.id!==id);save();refresh();
}
async function settings(){
  sheet(hd('Settings')+`<div class="glass rounded-2xl p-4 mb-4">${ME?`<div class="flex items-center gap-3">${avatar(ME.name)}<div class="flex-1 min-w-0"><div class="font-bold truncate">${esc(ME.name)}</div><div class="text-xs text-gray-500 truncate">${esc(ME.email)}</div></div><button onclick="signOut()" class="ghost px-3 py-2 text-xs font-semibold">Sign out</button></div><p class="text-xs text-gray-500 mt-2">Your loans sync across your devices.</p>`:`<div class="font-bold">Save and sync your loans</div><p class="text-xs text-gray-500 mt-1 mb-3">Create an account to use Mintly on any device.</p><div class="flex gap-2"><button onclick="authSheet(0)" class="ghost flex-1 py-2.5 text-xs font-semibold">Sign in</button><button onclick="authSheet(1)" class="pill flex-1 py-2.5 text-xs font-bold">Create account</button></div>`}<div id="srv" class="text-[11px] mt-3 text-gray-500">Checking server...</div></div>
  ${lb('Payment instructions shown to borrowers')}<textarea id="pay" rows="4" class="inp" placeholder="Bank transfer, Venmo handle, cash pickup...">${esc(S.pay)}</textarea>
  <div class="flex gap-2 mt-3"><button class="ghost flex-1 py-3 text-xs font-semibold flex items-center justify-center gap-1.5" onclick="exportData()">${ic('dl',14)}Export backup</button><button class="ghost flex-1 py-3 text-xs font-semibold flex items-center justify-center gap-1.5" onclick="$('#imp').click()">${ic('up',14)}Import backup</button><input id="imp" type="file" accept="application/json" class="hidden" onchange="importData(this)"></div>
  <button onclick="S.pay=$('#pay').value;save();syncAll();closeM();toast('Saved')" class="pill w-full py-3.5 font-bold text-sm mt-3">Save</button>`);
  try{const r=await api('health');const e=$('#srv');if(e)e.innerHTML='<span style="color:#0f7a3d;font-weight:700">Server online</span>'+(r.kv?' &middot; storage connected':'')}catch(x){const e=$('#srv');if(e)e.innerHTML='<span style="color:#b91c1c;font-weight:700">Server problem:</span> '+esc(x.message)}
}
function exportData(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='mintly-backup-'+iso(new Date())+'.json';a.click();toast('Backup downloaded')}
function importData(i){const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.loans))throw 0;S={...def(),...o};save();closeM();render();toast('Backup restored')}catch{toast('Not a valid Mintly backup')}};if(i.files[0])r.readAsText(i.files[0])}
boot();
</script>
</body>
